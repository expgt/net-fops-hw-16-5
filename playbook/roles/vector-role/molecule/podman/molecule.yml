---
dependency:
  name: galaxy
driver:
  name: podman
platforms:
  - name: ubuntu
    image: docker.io/pycontribs/ubuntu:latest
    pre_build_image: true
    command: sleep infinity
    systemd: false
provisioner:
  name: ansible
  inventory:
    group_vars:
      all:
        ansible_become: false
verifier:
  name: ansible
scenario:
  test_sequence:
    - syntax
    - create
    - converge
    - verify
    - destroy
