---
# tasks file for vector-role
- name: Ensure Vector configuration directory exists
  become: true
  ansible.builtin.file:
    path: "{{ vector_config_dir }}"
    state: directory
    mode: '0755'

# --- Блок установки для Debian / Ubuntu ---
- name: Download Vector DEB package
  ansible.builtin.get_url:
    url: "https://install.datadoghq.com/vector/{{ vector_version }}/vector_{{ vector_version }}-1_amd64.deb"
    dest: "/tmp/vector_{{ vector_version }}-1_amd64.deb"
    mode: '0644'
  register: download_deb
  until: download_deb is succeeded
  retries: 3
  delay: 5
  when: ansible_facts['os_family'] == "Debian"

- name: Install Vector DEB package via APT
  become: true
  ansible.builtin.apt:
    deb: "/tmp/vector_{{ vector_version }}-1_amd64.deb"
    state: present
  when: ansible_facts['os_family'] == "Debian"

# --- Блок установки для RedHat / OracleLinux ---
- name: Download Vector RPM package
  ansible.builtin.get_url:
    url: "https://install.datadoghq.com/vector/{{ vector_version }}/vector-{{ vector_version }}-1.x86_64.rpm"
    dest: "/tmp/vector-{{ vector_version }}-1.x86_64.rpm"
    mode: '0644'
  when: ansible_facts['os_family'] == "RedHat"

- name: Install Vector RPM package via YUM
  become: true
  ansible.builtin.yum:
    name: "/tmp/vector-{{ vector_version }}-1.x86_64.rpm"
    state: present
    disable_gpg_check: true
  when: ansible_facts['os_family'] == "RedHat"

# --- Общие задачи настройки ---
- name: Deploy Vector configuration from template
  become: true
  ansible.builtin.template:
    src: vector.yaml.j2
    dest: "{{ vector_config_dir }}/vector.yaml"
    mode: '0644'
  notify: Restart vector service

- name: Start and enable Vector service
  become: true
  ansible.builtin.service:
    name: vector
    enabled: true
    state: started
  when:
    - not ansible_check_mode
    - ansible_virtualization_type != "docker"
    - ansible_virtualization_type != "podman"
